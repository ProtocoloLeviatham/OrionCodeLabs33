      <polygon points="106,120 109.2,130.8 120,134 109.2,137.2 106,148 102.8,137.2 92,134 102.8,130.8" fill="#2563EB"/>
      <polygon points="130,90 134.5,105.5 150,110 134.5,114.5 130,130 125.5,114.5 110,110 125.5,105.5" fill="#4F46E5"/>
